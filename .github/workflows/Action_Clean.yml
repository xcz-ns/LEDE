name: Action_Clean
on:
  workflow_run:
    workflows:
      - OpenWrt_Build
      - OpenWrt_Toolchain_Build
      - Export_Caches_to_Artifacts
    types:
      - completed

  workflow_dispatch:
    inputs:
      keep_releases:
        description: "每个设备保留 Release 的数量"
        required: true
        default: "3"
        type: string

      keep_build_runs:
        description: "每个设备保留 Build 成功记录数"
        required: true
        default: "3"
        type: string

      keep_toolchain_runs:
        description: "保留 Toolchain 成功记录数"
        required: true
        default: "3"
        type: string

      keep_export_runs:
        description: "保留 Export 成功记录数"
        required: true
        default: "3"
        type: string

      retain_days:
        description: "保留天数 (0 为不限)"
        required: true
        default: "0"
        type: string

      clean_failed_runs:
        description: "清空异常记录 (含失败/取消/超时)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    name: 🧹 删除工作流
    runs-on: ubuntu-22.04

    steps:
      # ==========================
      # 1. 删除旧 Release 和 Tag（按设备分别保留）
      # ==========================
      - name: 清理旧版 Release (按设备各保留最新 N 个)
        if: github.event_name == 'workflow_dispatch' || contains(github.event.workflow_run.path, 'OpenWrt_Build.yml')
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # 设备列表（需与 OpenWrt_Build.yml 中的设备保持一致）
          DEVICES="LEDE_Cudy LEDE_R3S LEDE_x86"
          KEEP="${{ github.event.inputs.keep_releases || 3 }}"

          echo "========================================"
          echo "按设备清理 Release，每设备保留最新 $KEEP 个"
          echo "========================================"

          # tag 格式：YYYYMMDD-HHMM-设备名
          # 按设备分别筛选，每个设备保留最新 KEEP 个，删除更早的
          for DEVICE in $DEVICES; do
            echo "--- 处理设备：$DEVICE ---"

            OLD_TAGS=$(
              gh release list \
                --repo "$REPO" \
                --limit 100 \
                --json tagName,publishedAt \
                -q 'sort_by(.publishedAt) | reverse | .[].tagName' \
                | grep -E "-${DEVICE}$" \
                | tail -n +$((KEEP + 1)) || true
            )

            if [ -z "$OLD_TAGS" ]; then
              echo "  无需清理的旧 Release。"
              continue
            fi

            for TAG in $OLD_TAGS; do
              echo "  删除旧 Release：$TAG"
              gh release delete "$TAG" \
                --repo "$REPO" \
                --cleanup-tag \
                --yes \
                || true
            done
          done

          echo "========================================"
          echo "Release 清理完成"
          echo "========================================"

      # ==========================
      # 2. 清理 OpenWrt_Build
      # ==========================
      - name: 清理 OpenWrt_Build (异常记录 - 仅手动选择)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.clean_failed_runs == 'true'
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          delete_workflow_pattern: "OpenWrt_Build.yml"
          delete_run_by_conclusion_pattern: "neutral,failure,cancelled,skipped,timed_out"
          keep_minimum_runs: 0
          retain_days: 0

      - name: 清理 OpenWrt_Build (自动清空灰色无用记录)
        if: github.event_name == 'workflow_dispatch' || contains(github.event.workflow_run.path, 'OpenWrt_Build.yml')
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          delete_workflow_pattern: "OpenWrt_Build.yml"
          delete_run_by_conclusion_pattern: "neutral,cancelled,skipped"
          keep_minimum_runs: 0
          retain_days: 0

      - name: 清理 OpenWrt_Build (按设备各保留最新 N 个成功记录)
        if: github.event_name == 'workflow_dispatch' || contains(github.event.workflow_run.path, 'OpenWrt_Build.yml')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # 设备列表（需与 OpenWrt_Build.yml 中的设备保持一致）
          DEVICES="LEDE_Cudy LEDE_R3S LEDE_x86"
          KEEP="${{ github.event.inputs.keep_build_runs || 3 }}"

          echo "========================================"
          echo "按设备清理 OpenWrt_Build 成功记录，每设备保留最新 $KEEP 个"
          echo "========================================"

          # run-name 格式：「构建 设备名」，通过 displayTitle 筛选设备
          # 按设备分别筛选成功记录，每个设备保留最新 KEEP 个，删除更早的
          for DEVICE in $DEVICES; do
            echo "--- 处理设备：$DEVICE ---"

            OLD_IDS=$(
              gh run list \
                --repo "$REPO" \
                --workflow "OpenWrt_Build.yml" \
                --limit 100 \
                --json databaseId,displayTitle,conclusion,createdAt \
                -q "sort_by(.createdAt) | reverse | .[] | select(.conclusion == \"success\") | select(.displayTitle | test(\"${DEVICE}\")) | .databaseId" \
                | tail -n +$((KEEP + 1)) || true
            )

            if [ -z "$OLD_IDS" ]; then
              echo "  无需清理的旧运行记录。"
              continue
            fi

            for RUN_ID in $OLD_IDS; do
              echo "  删除旧运行：$RUN_ID"
              gh run delete "$RUN_ID" --repo "$REPO" || true
            done
          done

          echo "========================================"
          echo "OpenWrt_Build 成功记录清理完成"
          echo "========================================"

      # ==========================
      # 3. 清理 OpenWrt_Toolchain_Build
      # ==========================
      - name: 清理 OpenWrt_Toolchain_Build (异常记录 - 仅手动选择)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.clean_failed_runs == 'true'
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          delete_workflow_pattern: "OpenWrt_Toolchain_Build.yml"
          delete_run_by_conclusion_pattern: "neutral,failure,cancelled,skipped,timed_out"
          keep_minimum_runs: 0
          retain_days: 0

      - name: 清理 OpenWrt_Toolchain_Build (自动清空灰色无用记录)
        if: github.event_name == 'workflow_dispatch' || contains(github.event.workflow_run.path, 'OpenWrt_Toolchain_Build.yml')
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          delete_workflow_pattern: "OpenWrt_Toolchain_Build.yml"
          delete_run_by_conclusion_pattern: "neutral,cancelled,skipped"
          keep_minimum_runs: 0
          retain_days: 0

      - name: 清理 OpenWrt_Toolchain_Build (按配额保留成功记录)
        if: github.event_name == 'workflow_dispatch' || contains(github.event.workflow_run.path, 'OpenWrt_Toolchain_Build.yml')
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          delete_workflow_pattern: "OpenWrt_Toolchain_Build.yml"
          delete_run_by_conclusion_pattern: "success"
          keep_minimum_runs: ${{ github.event.inputs.keep_toolchain_runs || 3 }}
          retain_days: ${{ github.event.inputs.retain_days || 0 }}

      # ==========================
      # 4. 清理 Export_Caches_to_Artifacts
      # ==========================
      - name: 清理 Export_Caches_to_Artifacts (异常记录 - 仅手动选择)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.clean_failed_runs == 'true'
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          delete_workflow_pattern: "Export_Caches_to_Artifacts.yml"
          delete_run_by_conclusion_pattern: "neutral,failure,cancelled,skipped,timed_out"
          keep_minimum_runs: 0
          retain_days: 0

      - name: 清理 Export_Caches_to_Artifacts (自动清空灰色无用记录)
        if: github.event_name == 'workflow_dispatch' || contains(github.event.workflow_run.path, 'Export_Caches_to_Artifacts.yml')
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          delete_workflow_pattern: "Export_Caches_to_Artifacts.yml"
          delete_run_by_conclusion_pattern: "neutral,cancelled,skipped"
          keep_minimum_runs: 0
          retain_days: 0

      - name: 清理 Export_Caches_to_Artifacts (按配额保留成功记录)
        if: github.event_name == 'workflow_dispatch' || contains(github.event.workflow_run.path, 'Export_Caches_to_Artifacts.yml')
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          delete_workflow_pattern: "Export_Caches_to_Artifacts.yml"
          delete_run_by_conclusion_pattern: "success"
          keep_minimum_runs: ${{ github.event.inputs.keep_export_runs || 3 }}
          retain_days: ${{ github.event.inputs.retain_days || 0 }}

      # ==========================
      # 5. 清理清理脚本自身的工作流
      # ==========================
      - name: 清理 Action_Clean 自身记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          delete_workflow_pattern: "Action_Clean.yml"
          keep_minimum_runs: 0
          retain_days: 0
