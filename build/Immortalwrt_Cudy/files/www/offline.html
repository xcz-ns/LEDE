<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无法访问此网页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4ecf5 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
            padding: 56px 48px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fff1f0 0%, #ffe3e1 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(255, 77, 79, 0.2);
            }
            50% {
                box-shadow: 0 0 0 12px rgba(255, 77, 79, 0);
            }
        }

        .error-icon svg {
            width: 36px;
            height: 36px;
            stroke: #ff4d4f;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #1d2129;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #6b7785;
            margin-bottom: 36px;
            line-height: 1.7;
        }

        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, #e5e7eb, transparent);
            margin: 28px 0;
        }

        .reason-list {
            text-align: left;
            margin-bottom: 40px;
        }

        .reason-list h3 {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 16px;
            color: #333;
        }

        .reason-list ul {
            list-style: none;
            padding-left: 0;
        }

        .reason-list li {
            font-size: 14px;
            color: #595f6b;
            padding: 8px 0 8px 24px;
            position: relative;
            line-height: 1.7;
        }

        .reason-list li::before {
            content: "";
            position: absolute;
            left: 6px;
            top: 16px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #c9cdd4;
        }

        .btn-back {
            width: 100%;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            color: #fff;
            background: linear-gradient(135deg, #1677ff 0%, #4096ff 100%);
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(22, 119, 255, 0.2);
        }

        .btn-back:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(22, 119, 255, 0.3);
        }

        .btn-back:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #a0a6b1;
            letter-spacing: 0.5px;
        }

        @media (max-width: 480px) {
            .error-container {
                padding: 40px 28px;
            }

            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        </div>

        <h1>无法访问此网页</h1>
        <p class="subtitle">
            连接已中断，无法加载您请求的页面<br>
            请检查网络后重试，或返回上一页
        </p>

        <div class="divider"></div>

        <div class="reason-list">
            <h3>可能的原因</h3>
            <ul>
                <li>网络连接断开或信号不稳定</li>
                <li>目标网站服务器暂时不可用</li>
                <li>网址输入有误或页面已被移除</li>
                <li>防火墙或安全规则阻止了访问</li>
            </ul>
        </div>

        <button class="btn-back" onclick="window.history.back()">返回上一页</button>

        <div class="footer">ERR_CONNECTION_FAILED</div>
    </div>
</body>
</html>
